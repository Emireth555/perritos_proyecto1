server {
    listen 80;
    client_max_body_size 10m;   # fotos

    # El backend del P1 ya incluye /api en sus rutas: NO se quita el prefijo
    location /api/ {
        proxy_pass http://backend:3000;
    }

    # El router de Elixir también escribe sus rutas con /f
    location /f/ {
        proxy_pass http://funcional:4000;
    }

    location / {
        proxy_pass http://frontend:80;
    }
}